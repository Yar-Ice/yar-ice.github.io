<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yar_Ice — Developer Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #07090e;
    }

    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(13, 18, 28, 0.85);
      --bg-card-hover: rgba(18, 26, 40, 0.95);
      --cyan-main: #00e5ff;
      --cyan-glow: rgba(0, 229, 255, 0.35);
      --border-color: rgba(0, 229, 255, 0.22);
      --border-hover: rgba(0, 229, 255, 0.55);
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 16px 60px;
    }

    /* Header & Profile */
    .profile-header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px 24px;
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrapper {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(135deg, var(--cyan-main), transparent 70%);
      box-shadow: 0 0 18px var(--cyan-glow);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #0d131d;
    }

    .user-details h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .user-details p {
      font-size: 13px;
      color: var(--cyan-main);
      font-family: var(--font-mono);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .social-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(0, 229, 255, 0.1);
      border-color: var(--cyan-main);
      color: var(--cyan-main);
      box-shadow: 0 0 12px var(--cyan-glow);
      transform: translateY(-2px);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Hero & Eye Section */
    .hero-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 28px 32px;
      backdrop-filter: blur(12px);
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 24px;
      align-items: center;
      margin-bottom: 24px;
    }

    .hero-text h2 {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, var(--cyan-main));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-text p {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.6;
    }

    .eye-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #eyeCanvas {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      cursor: crosshair;
    }

    /* Tabs Bar */
    .tabs-nav {
      display: flex;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 6px;
      backdrop-filter: blur(12px);
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      min-width: 110px;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab-btn.active {
      background: var(--cyan-main);
      color: #000000;
      font-weight: 600;
      box-shadow: 0 0 15px var(--cyan-glow);
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }

    .project-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 229, 255, 0.15);
    }

    .card-img-wrapper {
      width: 100%;
      height: 160px;
      background: #0d131d;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--border-color);
      font-family: var(--font-mono);
      font-size: 13px;
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-desc {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      flex-grow: 1;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.2);
      color: var(--cyan-main);
    }

    .card-links {
      display: flex;
      gap: 10px;
    }

    .card-btn {
      flex: 1;
      padding: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .btn-github {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .btn-github:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--text-primary);
    }

    .btn-demo {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--cyan-main);
      color: var(--cyan-main);
    }

    .btn-demo:hover {
      background: var(--cyan-main);
      color: #000;
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: 16px;
      color: var(--text-secondary);
    }

    @media (max-width: 850px) {
      .hero-section {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .eye-wrapper {
        order: -1;
      }
      .profile-header {
        justify-content: center;
        text-align: center;
      }
      .user-info {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <div class="app-container">
    
    <!-- Profile Header -->
    <header class="profile-header">
      <div class="user-info">
        <div class="avatar-wrapper">
          <img id="userAvatar" class="avatar-img" src="" alt="Yar_Ice Avatar">
        </div>
        <div class="user-details">
          <h1>Yar_Ice</h1>
          <p>Developer</p>
        </div>
      </div>
      <div class="social-links" id="socialsContainer"></div>
    </header>

    <!-- Hero Section with Realistic 3D Eye -->
    <section class="hero-section">
      <div class="hero-text">
        <h2>Cyber-Ice Workspace</h2>
        <p>Software development, custom bots, scripts, and high-performance applications.</p>
      </div>
      <div class="eye-wrapper">
        <canvas id="eyeCanvas" width="260" height="260"></canvas>
      </div>
    </section>

    <!-- Project Tabs Navigation -->
    <nav class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('ai')">AI Projects</button>
      <button class="tab-btn" onclick="switchTab('cybersecurity')">Cyber Security</button>
      <button class="tab-btn" onclick="switchTab('python')">Python</button>
      <button class="tab-btn" onclick="switchTab('apps')">Apps</button>
      <button class="tab-btn" onclick="switchTab('programs')">Programs</button>
    </nav>

    <!-- Projects Grid Container -->
    <div class="projects-grid" id="projectsGrid"></div>

  </div>

  <script>
    /* ==========================================================================
       1. CONFIGURATION
       ========================================================================== */
    const SITE_CONFIG = {
      
      avatarUrl: "https://i.postimg.cc/4yM0rYG9/Bezymannyj.png",

      socials: [
        { label: "GitHub", url: "https://github.com/Yar-Ice", icon: "github" },
        { label: "Telegram", url: "https://t.me/Lord666ice", icon: "telegram" },
        { label: "TG Channel", url: "https://web.telegram.org/a/#-1003923141564", icon: "channel" },
        { label: "YouTube", url: "https://www.youtube.com/@Yar_Ice_Official", icon: "youtube" }
      ],

      projects: [
        {
          id: "p1",
          category: "ai",
          title: "AI Neural Bot",
          description: "Интеллектуальный ассистент с интеграцией нейросетей.",
          tags: ["Python", "AI", "API"],
          githubUrl: "https://github.com/Yar-Ice",
          demoUrl: "https://t.me/Lord666ice",
          image: ""
        },
        {
          id: "p2",
          category: "python",
          title: "Telegram Utility Bot",
          description: "Асинхронный бот для автоматизации задач.",
          tags: ["Python", "aiogram", "Asyncio"],
          githubUrl: "https://github.com/Yar-Ice",
          demoUrl: "https://t.me/Lord666ice",
          image: ""
        }
      ]
    };

    /* ==========================================================================
       2. REALISTIC 3D EYE GRAPHICS & TRACKING ENGINE
       ========================================================================== */
    const eyeCanvas = document.getElementById('eyeCanvas');
    const ctx = eyeCanvas.getContext('2d');
    
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let eyeCenter = { x: 0, y: 0 };
    let irisPos = { x: 0, y: 0, targetX: 0, targetY: 0 };

    function updateEyeCenter() {
      const rect = eyeCanvas.getBoundingClientRect();
      eyeCenter.x = rect.left + rect.width / 2;
      eyeCenter.y = rect.top + rect.height / 2;
    }

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('resize', updateEyeCenter);
    window.addEventListener('scroll', updateEyeCenter);

    function drawEye() {
      ctx.clearRect(0, 0, 260, 260);
      
      const dx = mouse.x - eyeCenter.x;
      const dy = mouse.y - eyeCenter.y;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      const maxRadius = 38;
      const moveDist = Math.min(dist / 12, maxRadius);
      
      irisPos.targetX = Math.cos(angle) * moveDist;
      irisPos.targetY = Math.sin(angle) * moveDist;

      irisPos.x += (irisPos.targetX - irisPos.x) * 0.1;
      irisPos.y += (irisPos.targetY - irisPos.y) * 0.1;

      const cx = 130;
      const cy = 130;

      // Outer Socket Glow & Border
      ctx.beginPath();
      ctx.arc(cx, cy, 120, 0, Math.PI * 2);
      ctx.fillStyle = '#0b0f17';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Eyeball Base Shadow
      const ScleraGrad = ctx.createRadialGradient(cx, cy, 35, cx, cy, 115);
      ScleraGrad.addColorStop(0, '#ffffff');
      ScleraGrad.addColorStop(0.7, '#d5e0ea');
      ScleraGrad.addColorStop(1, '#627080');
      
      ctx.beginPath();
      ctx.arc(cx, cy, 115, 0, Math.PI * 2);
      ctx.fillStyle = ScleraGrad;
      ctx.fill();

      // Iris Center Position
      const ix = cx + irisPos.x;
      const iy = cy + irisPos.y;

      // Iris Body
      const irisGrad = ctx.createRadialGradient(ix, iy, 5, ix, iy, 50);
      irisGrad.addColorStop(0, '#00f0ff');
      irisGrad.addColorStop(0.4, '#0088cc');
      irisGrad.addColorStop(0.8, '#003366');
      irisGrad.addColorStop(1, '#001122');

      ctx.beginPath();
      ctx.arc(ix, iy, 50, 0, Math.PI * 2);
      ctx.fillStyle = irisGrad;
      ctx.fill();

      // Iris Fibers
      ctx.save();
      ctx.translate(ix, iy);
      for (let i = 0; i < 36; i++) {
        ctx.rotate((Math.PI * 2) / 36);
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(48, 0);
        ctx.strokeStyle = `rgba(0, 229, 255, ${0.15 + (i % 3) * 0.1})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      ctx.restore();

      // Pupil
      ctx.beginPath();
      ctx.arc(ix, iy, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#05070a';
      ctx.fill();

      // Specular Glare (Light Reflection)
      ctx.beginPath();
      ctx.arc(ix - 14, iy - 14, 9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(ix + 16, iy + 12, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fill();

      requestAnimationFrame(drawEye);
    }

    /* ==========================================================================
       3. BACKGROUND CANVAS PARTICLES
       ========================================================================== */
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4,
        size: Math.random() * 2 + 1
      });
    }

    function animateBg() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0) p.x = bgCanvas.width;
        if (p.x > bgCanvas.width) p.x = 0;
        if (p.y < 0) p.y = bgCanvas.height;
        if (p.y > bgCanvas.height) p.y = 0;

        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        bgCtx.fillStyle = 'rgba(0, 229, 255, 0.25)';
        bgCtx.fill();
      });

      requestAnimationFrame(animateBg);
    }

    /* ==========================================================================
       4. UI & RENDERING LOGIC
       ========================================================================== */
    let currentTab = 'ai';

    function initSite() {
      const avatarImg = document.getElementById('userAvatar');
      if (SITE_CONFIG.avatarUrl) {
        avatarImg.src = SITE_CONFIG.avatarUrl;
      } else {
        avatarImg.style.display = 'none';
      }

      const icons = {
        github: '<svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>',
        telegram: '<svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.121l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.128.832.941z"/></svg>',
        channel: '<svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>',
        youtube: '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>'
      };

      const socialsContainer = document.getElementById('socialsContainer');
      SITE_CONFIG.socials.forEach(item => {
        const btn = document.createElement('a');
        btn.className = 'social-btn';
        btn.href = item.url;
        btn.target = '_blank';
        btn.rel = 'noopener';
        btn.innerHTML = `${icons[item.icon] || ''} <span>${item.label}</span>`;
        socialsContainer.appendChild(btn);
      });

      renderProjects();
      updateEyeCenter();
      drawEye();
      animateBg();
    }

    function switchTab(tabCategory) {
      currentTab = tabCategory;
      
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('onclick').includes(tabCategory)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderProjects();
    }

    function renderProjects() {
      const grid = document.getElementById('projectsGrid');
      grid.innerHTML = '';

      const filtered = SITE_CONFIG.projects.projects || SITE_CONFIG.projects.filter ? SITE_CONFIG.projects.filter(p => p.category === currentTab) : [];

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>No projects uploaded in this section yet.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';
        
        const tagsHtml = p.tags.map(t => `<span class="tag">${t}</span>`).join('');
        
        let imgHtml = `<div class="card-img-placeholder">&lt;/&gt; CODE PROJECT</div>`;
        if (p.image) {
          imgHtml = `<img src="${p.image}" alt="${p.title}">`;
        }

        let linksHtml = '';
        if (p.githubUrl) {
          linksHtml += `<a href="${p.githubUrl}" target="_blank" class="card-btn btn-github">GitHub</a>`;
        }
        if (p.demoUrl) {
          linksHtml += `<a href="${p.demoUrl}" target="_blank" class="card-btn btn-demo">Demo / Bot</a>`;
        }

        card.innerHTML = `
          <div class="card-img-wrapper">
            ${imgHtml}
          </div>
          <div class="card-content">
            <h3 class="card-title">${p.title}</h3>
            <p class="card-desc">${p.description}</p>
            <div class="card-tags">${tagsHtml}</div>
            <div class="card-links">${linksHtml}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    window.onload = initSite;
  </script>
</body>
</html>
